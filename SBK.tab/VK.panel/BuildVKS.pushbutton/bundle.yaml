title: "Менеджер\nспецификаций"
tooltip: >-
  Спецификации по ГОСТ 21.601-2011 одной кнопкой. Шесть окон: системы и группы (связки, перетаскивание,
  «Делить по» — любой параметр); что специфицируем (+ «Заполнить количество»); материалы и типы (шаг можно
  выключить — тогда «по имени»); сортировка (общая и своя для категории); материалы — покраска и крепёж из
  личного справочника, одна таблица на связку; листы (высота строк со схемой, нумерация позиций и листов,
  число листов в штамп). Чтение модели и сборка — с процентами и оценкой «осталось». Отмена — Ctrl+Z одним шагом.
  «Исправить в Revit» — проблемные элементы списком поверх Revit.
author: Zhaskairat001
